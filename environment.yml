name: blade

# Environment for BLADE (Beamline Automation and Device Experiments): the `blade` CLI/GUI, blade/ package, tests/.
#   conda env create -f environment.yml && conda activate blade && pip install -e .
#   (`pip install -e .` is a separate step: it installs BLADE itself, giving the `blade` and `blade-gui` commands; conda does not do it.)
#   Quick GUI without activating anything: `./blade-gui` (see README: it finds this env by itself).
#
# Versions follow the user's `midas-gui` environment so the two stay interchangeable: numpy is held at 1.26.4 because
# pvapy 5.4.1 (the last release before the numpy>=2 floor) is paired with it there.
# Everything the SIMULATED workflow needs is conda-forge; pvapy/pyepics (used only by the real-beamline backend,
# blade/backends/epics.py, i.e. `blade align new-run --backend epics --camera <name>`) come from pip, exactly as in midas-gui.
# Installing them does not by itself connect to anything.

channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.12

  # ── core numerics / images (used by blade/alignment, blade/backends/sim) ──
  - numpy=1.26.4
  - scipy=1.17.1
  - pillow                 # overlay JPEGs, screenshot loader (PIL)

  # ── data + figures (tests/test_identity.py, test_partial.py read the HDF5 scans) ──
  - h5py=3.16.0
  - matplotlib-base=3.10.*
  - cmcrameri=1.9          # the user's scientific-plotting colormaps (conda package 1.9; the module's __version__ string says 1.8)

  # ── the web GUI (blade gui / blade-gui, incl. the beamline twin viewer) and beamline_twins/tools/twin.py are stdlib-only; nothing to install for them ──
  #    (the twins are JSON on purpose, so there is no YAML dependency)

  - pip
  - pip:
    # Real-beamline backend only (read-only camera frames over PVA; motor records over CA). NOT needed for the simulator (--backend sim).
    - "pvapy==5.4.1"       # pinned: 5.5.0+ requires numpy>=2.0
    - "pyepics==3.5.10"
    # MCP server (`blade mcp`): how other agents reach BLADE workflows. Supports mcp 1.x (FastMCP) and 2.x (MCPServer).
    - "mcp>=1.2"
